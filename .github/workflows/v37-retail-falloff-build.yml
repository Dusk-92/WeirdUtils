name: Temporary V37 Retail Falloff build

on:
  push:
    branches:
      - test/v37-retail-falloff

permissions:
  contents: read

jobs:
  build-v37:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V37
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build standalone variants
        shell: bash
        run: |
          set -euo pipefail
          zig build all-variants -Doptimize=ReleaseSmall \
            -Dweirdperformance=false \
            -Doutline=true \
            -Dcustomassets=true \
            -Dtransmogfix=true

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package/DLL
          mkdir -p package/Interface/AddOns/WeirdUtils_Outline
          mkdir -p dist

          cp zig-out/variants/customassets.dll package/DLL/customassets.dll
          cp zig-out/variants/transmogfix.dll package/DLL/transmogfix.dll
          cp zig-out/variants/outline.dll package/DLL/outline.dll

          cp src/outline/addon/Bindings.xml package/Interface/AddOns/WeirdUtils_Outline/Bindings.xml
          cp src/outline/addon/Outline.lua package/Interface/AddOns/WeirdUtils_Outline/Outline.lua
          cp src/outline/addon/WeirdUtils_Outline.toc package/Interface/AddOns/WeirdUtils_Outline/WeirdUtils_Outline.toc

          printf '%s\n'             'WeirdUtils V37 Retail Falloff'             'Base: V36 Retail Soft AutoFix'             'Auto target + automatic D3D9 rehook retained.'             'V34 full-float JFA retained.'             'Final decode: 1.35px core + smooth falloff to 3.20px.'             'Still only two texture reads in decode.'             'WeirdPerformance is not built or modified.' > package/README_TEST.txt

          (
            cd package
            sha256sum DLL/*.dll > SHA256SUMS.txt
            zip -r ../dist/WeirdUtils_safe_core_V8_RETAIL37_FALLOFF_AUTOFIX_ORIGINAL_WeirdPerformance.zip DLL Interface README_TEST.txt SHA256SUMS.txt
          )

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: WeirdUtils-safe-core-V8-RETAIL37-FALLOFF-AUTOFIX
          path: dist/WeirdUtils_safe_core_V8_RETAIL37_FALLOFF_AUTOFIX_ORIGINAL_WeirdPerformance.zip
          if-no-files-found: error
